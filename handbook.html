<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Learning Notebook · Full handbook</title><link rel="stylesheet" href="assets/css/styles.css"></head><body><main class="handbook" id="book"></main><script src="content/curriculum.js"></script><script src="content/starter.js"></script><script>

document.getElementById('book').innerHTML=`<div class="no-print"><a href="index.html">← Interactive learning hub</a> <button class="quiet" onclick="window.print()">Print / save as PDF</button></div><div class="eyebrow" style="margin-top:35px">VALUATION LAB / REFERENCE EDITION 26 SEPTEMBER 2026</div><h1>From trade value<br>to prudent valuation.</h1><p class="intro">A practical handbook for technology, data and application work around IPV, reserves, Fair Value Hierarchy and PruVal.</p><p>Read alongside the interactive labs. All examples are synthetic. General concepts use IFRS and EU regulatory references; actual implementation requires the applicable bank policy, jurisdiction and effective rule version. This is a learning foundation, not an exhaustive regulatory specification.</p><h2>Start from zero</h2><p>No prior trading knowledge needed. Read these introductions before the main course.</p><ol>${STARTER.map(l=>`<li><a href="#start-${l.id}">${l.title}</a></li>`).join('')}</ol><h2>Main course contents</h2><div class="handbook-toc">${[...new Set(LESSONS.map(l=>l.phase))].map(phase=>`<section><h3>${phase}</h3><ol start="${LESSONS.find(l=>l.phase===phase).id}">${LESSONS.filter(l=>l.phase===phase).map(l=>`<li><a href="#lesson-${l.id}">${l.title}</a></li>`).join('')}</ol></section>`).join('')}</div>${STARTER.map(l=>`<article id="start-${l.id}"><p>Start from zero · Introduction ${l.id}</p><h1>${l.title}</h1><div class="takeaway">${l.take}</div>${l.paragraphs.map(p=>`<p>${p}</p>`).join('')}<div class="example"><h2>A concrete example</h2><pre>${l.example}</pre></div><h2>Connect it to work</h2><p>${l.connection}</p><h2>Checkpoint</h2><p>${l.quiz.q}</p><ol type="A">${l.quiz.options.map(o=>`<li>${o}</li>`).join('')}</ol><p><strong>Answer: ${String.fromCharCode(65+l.quiz.correct)}.</strong> ${l.quiz.explain}</p></article>`).join('')}${LESSONS.map(l=>`<article id="lesson-${l.id}"><div class="eyebrow">${l.phase} / LESSON ${l.id}</div><h1>${l.title}</h1><div class="takeaway">${l.take}</div>${l.body.map(p=>`<p>${p}</p>`).join('')}<div class="example"><h3>${l.example.title}</h3><pre>${l.example.text}</pre><p>${l.example.explain}</p></div><h2>Go deeper</h2><p>${l.deep}</p><h2>Connect it to data and systems</h2><p>${l.data}</p><div class="watch"><strong>Common trap</strong><br>${l.pitfall}</div><h2>Checkpoint</h2><p>${l.quiz.q}</p><ol type="A">${l.quiz.options.map(o=>`<li>${o}</li>`).join('')}</ol><p><strong>Answer: ${String.fromCharCode(65+l.quiz.correct)}.</strong> ${l.quiz.explain}</p><p class="sources-inline">${links(l.sources)}</p></article>`).join('')}<article><h1>Formula reference</h1>${QUICK.map(r=>`<h3>${r[0]}</h3><p><strong>${r[1]}</strong></p><p>${r[2]}</p>`).join('')}<h1>Glossary</h1>${GLOSSARY.map(([a,b])=>`<h3>${a}</h3><p>${b}</p>`).join('')}</article><article><h1>Primary references</h1><p>Links need an internet connection. Some standard editions are dated; use the effective text for production work. Consultations are not enacted rules. The relevant PRA 2026 restatement becomes effective in January 2027.</p>${SOURCES.map(s=>`<h3>${s.title}</h3><p>${s.note}</p><p><a href="${s.url}" style="overflow-wrap:anywhere">${s.url}</a></p>`).join('')}</article>`;
</script></body></html>
