name: Verify and publish learning site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the learning content publicly to GitHub Pages
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check complete practice bundles
        run: |
          python scripts/sync-problem-solving.py --check
          python scripts/build-bundles.py --check
          python tests/resource-bundles.py
      - name: Verify lessons and calculations
        run: |
          node verify.cjs
          node tests/browser-python.cjs
      - name: Check contrast, target size and keyboard focus in Chrome
        run: node tests/ui-audit.cjs
      - name: Verify Kubernetes context guard without a cluster
        shell: pwsh
        run: ./paths/kubernetes/practice/test_lab_guard.ps1
      - name: Build portable static site
        run: node scripts/build-pages.cjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned packaging verification tools
        run: python -m pip install build==1.4.0 setuptools==82.0.1
      - name: Run downloadable Python workshops and algorithms
        run: python scripts/verify-python.py

  react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --prefix validation/react --ignore-scripts
      - name: Compile React workshops and run domain and component tests
        run: npm test --prefix validation/react

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build C# downloads and run HTTP acceptance checks
        run: python scripts/verify-dotnet.py

  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build the full-stack journey and run real HTTP checks
        run: python scripts/verify-fullstack.py

  data-science:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install scientific Python practice dependencies
        run: python -m pip install -r paths/data-analysis-python/practice/requirements.txt -r paths/machine-learning-foundations/practice/requirements.txt
      - name: Run data analysis and machine learning practice suites
        run: python scripts/verify-data-science.py

  sql-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # A throwaway Developer edition container with a per-run SA password; the image's own sqlcmd runs the script.
      - name: Start a disposable SQL Server container
        run: |
          password="Ln1-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SQLCMDPASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" -v /tmp:/tmp mcr.microsoft.com/mssql/server:2022-latest
          printf '#!/bin/sh\nexec docker exec -u 0 -e SQLCMDPASSWORD sql /opt/mssql-tools18/bin/sqlcmd "$@"\n' > "$RUNNER_TEMP/sqlcmd"
          chmod +x "$RUNNER_TEMP/sqlcmd"
          for attempt in $(seq 60); do
            if SQLCMDPASSWORD="$password" "$RUNNER_TEMP/sqlcmd" -S localhost -U sa -C -l 2 -Q "SELECT 1" > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs sql | tail -40
          exit 1
      - name: Run the SQL conflict classification tests
        env:
          TMPDIR: /tmp
        run: python -B tests/sql-conflicts.py --server localhost --user sa --trust-server-certificate --sqlcmd "$RUNNER_TEMP/sqlcmd"

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, python, react, dotnet, fullstack, data-science, sql-server]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
