name: Verify and publish learning site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the learning content publicly to GitHub Pages
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Check complete practice bundles
        run: |
          python scripts/sync-problem-solving.py --check
          python scripts/build-bundles.py --check
          python tests/resource-bundles.py
      - name: Verify lessons and calculations
        run: |
          node verify.cjs
          node tests/browser-python.cjs
      - name: Verify Kubernetes context guard without a cluster
        shell: pwsh
        run: ./paths/kubernetes/practice/test_lab_guard.ps1
      - name: Build portable static site
        run: node scripts/build-pages.cjs
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned packaging verification tools
        run: python -m pip install build==1.4.0 setuptools==82.0.1
      - name: Run downloadable Python workshops and algorithms
        run: python scripts/verify-python.py

  react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm ci --prefix validation/react --ignore-scripts
      - name: Compile React workshops and run domain and component tests
        run: npm test --prefix validation/react

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build C# downloads and run HTTP acceptance checks
        run: python scripts/verify-dotnet.py

  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build the full-stack journey and run real HTTP checks
        run: python scripts/verify-fullstack.py

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/main'
    needs: [build, python, react, dotnet, fullstack]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
