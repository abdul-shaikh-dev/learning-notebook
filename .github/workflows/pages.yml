name: Verify and publish learning site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Republish main to GitHub Pages (pushes to main publish automatically)
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # Every check in the build group of tests/checks.json; scripts/check-all.cjs runs the same list locally.
      - name: Formatting, bundles, lessons, browser Python, UI audit and site build
        run: node scripts/check-all.cjs --group build
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ["3.14", "3.15"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned packaging verification tools
        run: python -m pip install build==1.4.0 setuptools==82.0.1
      - name: Python workshops, algorithms and every checkpoint facts script
        run: node scripts/check-all.cjs --group python

  react:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Compile React workshops and run domain and component tests
        run: node scripts/check-all.cjs --group react

  dotnet:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Build C# downloads, run HTTP acceptance checks and C# checkpoint facts
        run: node scripts/check-all.cjs --group dotnet

  fullstack:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build the full-stack journey and run real HTTP checks
        run: node scripts/check-all.cjs --group fullstack

  data-science:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install scientific Python practice dependencies
        run: python -m pip install -r paths/data-analysis-python/practice/requirements.txt -r paths/machine-learning-foundations/practice/requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Data analysis and machine learning suites, worked examples and checkpoint facts
        run: node scripts/check-all.cjs --group data-science

  sql-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      # A throwaway Developer edition container with a per-run SA password; the image's own sqlcmd runs the script.
      - name: Start a disposable SQL Server container
        run: |
          password="Ln1-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SQLCMDPASSWORD=$password" >> "$GITHUB_ENV"
          docker run -d --name sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e "MSSQL_SA_PASSWORD=$password" -v /tmp:/tmp mcr.microsoft.com/mssql/server:2022-latest
          printf '#!/bin/sh\nexec docker exec -u 0 -e SQLCMDPASSWORD sql /opt/mssql-tools18/bin/sqlcmd "$@"\n' > "$RUNNER_TEMP/sqlcmd"
          chmod +x "$RUNNER_TEMP/sqlcmd"
          for attempt in $(seq 60); do
            if SQLCMDPASSWORD="$password" "$RUNNER_TEMP/sqlcmd" -S localhost -U sa -C -l 2 -Q "SELECT 1" > /dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker logs sql | tail -40
          exit 1
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: SQL conflict classification and SQL Server checkpoint facts
        env:
          TMPDIR: /tmp
          NOTEBOOK_SQL_ARGS: --server localhost --user sa --trust-server-certificate --sqlcmd ${{ runner.temp }}/sqlcmd
        run: node scripts/check-all.cjs --group sql-server

  deploy:
    # Every push to main publishes once all checks pass; a manual run republishes main without a new commit.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish))
    needs: [build, python, react, dotnet, fullstack, data-science, sql-server]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # The default 10 minutes was not enough on 6 November 2026, when file syncing stalled.
          timeout: 1200000
